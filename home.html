<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed | Social Platform</title>
    <link rel="stylesheet" href="home.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <h1 class="logo">Post Application</h1>
                <div class="nav-links">

                        <i class="fas fa-home"></i> All Posts

                    <a href="#" class="nav-link" data-category="Technology">
                        <i class="fas fa-laptop-code"></i> Technology

                        <i class="fas fa-heart"></i> Lifestyle
                    </a>
                    <a href="#" class="nav-link" data-category="Food">
                        <i class="fas fa-utensils"></i> Food

                </div>

           <!-- In the nav-right section, replace the user-menu -->
<div class="nav-right">

     <button id="myPostsBtn" class="btn btn-secondary">
    <a href="my post.html">   <i class="fas fa-user-circle"></i> My Posts</a> 
    </button>
    <button id="createPostBtn" class="btn btn-primary">
        <i class="fas fa-plus"></i> Create Post
    </button>
    <div class="user-menu">
        <div class="user-avatar" id="userAvatar">
            <!-- Avatar will be loaded here -->
        </div>
        <span id="userEmail">User</span>
        <button id="editProfileBtn" class="btn btn-secondary">
            <i class="fas fa-user-edit"></i> Profile
        </button>
        <button id="logoutBtn" class="btn btn-secondary">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>
</div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Category Filter Tabs -->
        <div class="category-tabs" id="categoryTabs">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Posts Feed -->
        <div class="feed-container">
            <div class="posts-grid" id="postsGrid">
                <!-- Posts will be loaded here -->
                <!-- <div class="loading">Loading posts...</div> -->
            </div>
        </div>
    </div>

    <!-- Post Modal (for create/edit) -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <h2 id="modalTitle">Create New Post</h2>
            <form id="postForm">
                <input type="hidden" id="postId" value="">
                
                <div class="form-group">
                    <label for="postTitle">Title</label>
                    <input type="text" id="postTitle" placeholder="Enter post title" required>
                </div>

                <div class="form-group">
                    <label for="postCategory">Category</label>
                    <select id="postCategory" required>
                        <option value="">Select Category</option>
                        <option value="Technology">Technology</option>
                        <option value="Lifestyle">Lifestyle</option>
                        <option value="Food">Food & Cooking</option>
                        <option value="Travel">Travel</option>
                        <option value="Education">Education</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="postContent">Content</label>
                    <textarea id="postContent" rows="6" placeholder="Write your post content..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="postImage">Image (optional)</label>
                    <input type="file" id="postImage" accept="image/*">
                    <div id="imagePreview" class="image-preview"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitPostBtn">
                        <span id="submitBtnText">Publish Post</span>
                    </button>
                    <button type="button" id="cancelPostBtn" class="btn btn-secondary">Cancel</button>
                    <button type="button" id="deletePostBtn" class="btn btn-danger" style="display: none;">
                        <i class="fas fa-trash"></i> Delete Post
                    </button>
                </div>
            </form>
        </div>
    </div>


    <!-- Post Details Modal -->
<div class="modal" id="postDetailsModal">
    <div class="modal-content post-details-modal">
        <button class="close-modal" id="closeDetails">&times;</button>
        <div id="postDetailsContent">
            <!-- Post details will be loaded here -->
        </div>
    </div>
</div>

<!-- Profile Modal -->
<div class="modal" id="profileModal">
    <div class="modal-content">
        <h2>Edit Profile</h2>
        <form id="profileForm">
            <div class="form-group">
                <div class="avatar-upload">
                    <div class="avatar-preview" id="avatarPreview">
                        <img id="currentAvatar" src="" alt="Avatar">
                    </div>
                    <label for="avatarInput" class="btn btn-secondary">
                        <i class="fas fa-camera"></i> Change Photo
                    </label>
                    <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                </div>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="userBio">Bio</label>
                <textarea id="userBio" rows="3" placeholder="Tell us about yourself..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Profile</button>
                <button type="button" id="cancelProfile" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    </div>
</div>

    <!-- JavaScript -->
    <script type="module" src="config.js"></script>
    <script type="module" src="home.js"></script>
</body>
</html>
